name: Q57 formalization
on:
  push:
    branches: ['lean/mathlib-4.36-q57']
    paths: ['lean/**', '.github/workflows/q57-statements.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get
      - name: Statement-only Question 5.7 audit
        run: lake build QuandleResearch.Questions.Issue013 QuandleResearch.Checks.Q57StatementAudit QuandleResearch.Checks.Q57SemanticRegression

      - name: Positive proof infrastructure (Mathlib)
        run: lake build QuandleResearch.Proofs.Q57.Principal QuandleResearch.Proofs.Q57.Absorption QuandleResearch.Proofs.Q57.OrbitTools QuandleResearch.Proofs.Q57.Connected
