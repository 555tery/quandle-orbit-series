name: Lean statements
on:
  push:
    paths: ['lean/**', '.github/workflows/lean-statements.yml']
  pull_request:
    paths: ['lean/**', '.github/workflows/lean-statements.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get
      - name: Focused Question 5.25 build
        if: github.ref_name == 'lean/mathlib-4.36-q525'
        run: lake build QuandleResearch.Proofs.Q525.Audit
      - name: Full library build
        if: github.ref_name != 'lean/mathlib-4.36-q525'
        run: lake build
