name: Kourovka 8.8(a) reduction
on:
  push:
    branches: ['lean/kourovka-8-8a']
    paths: ['lean/**', '.github/workflows/kourovka-8-8a.yml']
  pull_request:
    branches: ['lean/mathlib-4.36-q57']
    paths: ['lean/**', '.github/workflows/kourovka-8-8a.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kourovka-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.head_ref == 'lean/kourovka-8-8a'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update
      - run: lake exe cache get
      - name: Compile all Kourovka modules
        run: |
          set -o pipefail
          lake build QuandleResearch.Proofs.Kourovka88a.WeightedGreedy 2>&1 | tee kourovka-build.log
      - name: Statement and axiom audit of conditional theorems
        run: |
          set -o pipefail
          lake env lean QuandleResearch/Checks/Kourovka88aAudit.lean 2>&1 | tee kourovka-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          # The project still uses legacy modules. Allow only the exact
          # compatibility warning; every other warning is a CI failure.
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          logs = [ansi.sub("", Path(f).read_text()) for f in
                  ["kourovka-build.log", "kourovka-axioms.log"]]
          for line in "\n".join(logs).splitlines():
              if "warning:" in line.lower():
                  assert re.search(r"imports `[^\x60]+` from package `mathlib`, which is designed for use with the module system; consider adding `module` to the start of this file$", line), line
          log = logs[1]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = ["good_iff_quotient","mem_limit_iff","limit_normal","answer_of_chain","greedy_cover","answer_of_greedy_relators","nextRelator_eq","nextRelator_eq_one","adjoin_eq_of_mem","greedyStages_normal","greedyStages_mono","greedyStages_progress","greedyStages_strict_of_bad","greedyStages_stationary","greedyStages_cover","answer_of_greedyStages","letterWeight_pos","rawWeight_append","length_le_rawWeight","rawWeight_eq_zero_iff","weightedLength_eq_zero_iff","mem_letters","mem_boundedWords","mem_weightedBallCover","weightedLength_commWord","commWord_ne_one","answer_of_weighted_survival","heightRelator_one","heightRelator_mem_of_one","normalClosure_all_heights","exists_minBad","mem_badBall","badBall_subset","badBall_card_decreases","weighted_cover","weightedRelator_eq","weightedStages_normal","weightedStages_mono","weightedStages_progress","weightedStages_cover","answer_of_weightedStages","answer_of_weightedStages_short","weightedStages_eq_stage","weightedRankHeightRelator_one","weightedRankHeightRelator_mem","weightedHeightStage_eq","answer_of_heightStages_short","rawWeight_le_of_sublist","weightedLength_mk_le","weightedLength_mul_le","reduce_positive","toWord_positiveWord","positiveWord_append","weightedLength_positive_mul","rawWeight_replicate","weightedLength_a_zpow","weightedLength_b_zpow","positiveWord_repeat","weightedLength_positive_pow","positiveWord_longBlock","weightedLength_longBlock","adjacent_eq_odd","no_odd_cube","cube_even_descend","cubeFree_of_binary_rec","thueMorse_even","thueMorse_odd","thueMorse_cubeFree","thueLetter_eq_iff","thuePrefix_length","thuePrefix_get","thuePrefix_cubeFree","exists_eligiblePrefixEnd_after","nextPrefixEnd_spec","nextPrefixEnd_min","prefixEnd_eligible","prefixEnd_lt_succ","prefixEnd_gt_index","gubaPrefix_odd_length","gubaPrefix_last","gubaPrefix_first","gubaPrefix_second","positiveWord_length_le","exists_gubaEvenPrefix_weight_gt","chooseEvenPrefixIndex_spec","chooseEvenPrefixIndex_min","positiveWord_longRaw","weightedLength_longRaw_twice","weightedLength_longConjugator_twice","markerInterval_of_large","positiveWeight_append","positiveWeight_nil","positiveWeight_zero_imp_nil","prefix_of_positiveWeight_le","factor_of_weighted_interval","longRaw_prefix","longRaw_resolvent_factor","positiveWeight_separator","positiveWeight_resolvent_end","guba19_threshold","guba19_resolvent","mk_eq_a_zpow_of_light","eq_a_zpow_of_light","good_a_zpow","weight_ge_of_bad","chosenEvenPrefix_weight_ge","guba19_chosen_resolvent"]
          for name in names:
              match = re.search(r"'[^']*\." + name + r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if match:
                  used = {a.strip() for a in match.group(1).split(",") if a.strip()}
                  assert used <= allowed, (name, used - allowed)
              else:
                  assert re.search(r"'[^']*\." + name + r"' does not depend on any axioms", log), name
          PY
